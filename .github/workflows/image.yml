name: Build fork image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, us-east-1]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: ver
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/stackblaze/docmost:latest
            ghcr.io/stackblaze/docmost:sha-${{ steps.ver.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/stackblaze/docmost
